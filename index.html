<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalAll</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="#hero" aria-label="LocalAll home">LocalAll</a>
        <nav aria-label="Main navigation">
            <a href="#hero">Home</a>
            <a href="category/pdf/">PDF</a>
            <a href="category/image/">Image</a>
            <a href="category/video/">Vidéo</a>
            <a href="category/audio/">Audio</a>
        </nav>
    </header>
    <main>
        <section id="hero">
            <div class="hero-title">
                <h1>Everything</h1>
                <h2>In one place</h2>
            </div>
            <p>Your files should never leave your device.</p>
        </section>
        <section class="file-categories" aria-labelledby="categories-title">
            <div class="categories-heading reveal">
                <h2 id="categories-title">What's available?</h2>
            </div>
            <div class="category-grid">
                <a class="category-card reveal" id="pdf" href="category/pdf/">
                    <div class="category-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M6 2.75h8l4.25 4.5v14H6a2 2 0 0 1-2-2v-14a2.5 2.5 0 0 1 2-2.5Z" />
                            <path d="M14 3v5h4M7.5 15h9M7.5 18h6" />
                        </svg>
                    </div>
                    <h3>PDF</h3>
                    <p>Your documents, all together.</p>
                </a>
                <a class="category-card reveal" id="image" href="category/image/">
                    <div class="category-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <rect x="3" y="3" width="18" height="18" rx="3" />
                            <circle cx="8.5" cy="8.5" r="1.5" />
                            <path d="m21 15-5-5L5 21" />
                        </svg>
                    </div>
                    <h3>Image</h3>
                    <p>Every photo in one place.</p>
                </a>
                <a class="category-card reveal" id="video" href="category/video/">
                    <div class="category-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <rect x="3" y="5" width="18" height="14" rx="3" />
                            <path d="m10 9 5 3-5 3V9Z" />
                        </svg>
                    </div>
                    <h3>Vidéo</h3>
                    <p>Your videos, ready to find.</p>
                </a>
                <a class="category-card reveal" id="audio" href="category/audio/">
                    <div class="category-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M9 18V5l12-2v13" />
                            <circle cx="6" cy="18" r="3" />
                            <circle cx="18" cy="16" r="3" />
                        </svg>
                    </div>
                    <h3>Audio</h3>
                    <p>All your audio, close at hand.</p>
                </a>
            </div>
        </section>
    </main>
    <script src="assets/js/script.js"></script>
</body>
</html>
